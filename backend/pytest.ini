[pytest]
testpaths = tests
pythonpath = .
addopts = -q --tb=short

# Order matters: pytest applies these in sequence and the LAST matching entry
# wins, so the permissive default has to come first or it silently undoes
# every error filter below it.
filterwarnings =
    default
    error::DeprecationWarning
    # A leaked file handle is a real defect, not a nuisance: ingestion opens
    # thousands of corpus files, and a leak there exhausts the descriptor
    # table on a long run.
    error::ResourceWarning
    # A leak surfaces during garbage collection, outside the test body, so
    # pytest re-raises it wrapped in this and the filter above never sees it.
    error::pytest.PytestUnraisableExceptionWarning
    # Steps are exercised directly, without a Trainer, which is the point of a
    # unit test for them. Lightning warns that self.log has nowhere to go.
    ignore:You are trying to .self\.log:UserWarning
